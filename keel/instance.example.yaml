# Instance spec for the project forum, IPv6 first (docs/spec.md in keel).
# The forum is served at the apex, keellinux.org: a public services VM
# (2804:710:d0:5::13) terminates TLS and reverse proxies to this appliance
# over IPv6, so the fqdn and the NodeBB url are the apex and that VM is the
# trusted proxy for X-Forwarded-Proto.
# Copy to /etc/keel/instance.yaml in the rootfs and create the two secret
# files (mode 0600, owned by root) before the first boot:
#   /etc/keel/secrets/root_password
#   /etc/keel/secrets/app_password      the NodeBB admin password
version: 1

instance:
  hostname: forum
  fqdn: keellinux.org

network:
  # LXC: the host owns eth0 (macvlan, bridge mode) and the address comes by
  # SLAAC from the host's /64. Switch to method static with an address once
  # the DNS record exists, so the address the record points at never moves.
  managed_by: host
  interfaces:
    eth0:
      ipv6:
        method: auto

tls:
  acme:
    # false: TLS for the apex terminates on the public VM, not here. nginx
    # still serves /.well-known/acme-challenge/ for a future certificate of
    # its own.
    enabled: false
    challenge: http-01
    domains:
      - keellinux.org

secrets:
  root_password:
    file: /etc/keel/secrets/root_password
  app_password:
    file: /etc/keel/secrets/app_password

app:
  email: admin@keellinux.org
  domain: keellinux.org
  options:
    admin_user: admin
    trusted_proxy: "2804:710:d0:5::13"

security:
  alerts: skip
  updates: skip

hub:
  api_key: skip

first_login_wizard: false
