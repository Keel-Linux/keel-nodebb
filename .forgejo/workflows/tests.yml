# Forgejo copy of .github/workflows/tests.yml (decision 0056): the same
# jobs, with a runs-on line on each call of a reusable workflow,
# because Forgejo runs a called workflow on the runner of the caller.
# Tests of the keel-nodebb appliance recipe (decision 0006 point 4):
#   tests:      the first boot hook, the image check and the boot test library
#               under bats and kcov, threshold committed here
#   python:     nodebb.py and serve.py under pytest and coverage
#   appliance:  fetch the published layer, verify it, assemble it, boot it in
#               LXC and check the forum over IPv6, on the self-hosted runner
#   commission: the commissioning contract is there and valid (0075)
#   package:   a change that the layer ships needs a changelog entry, so it
#              can reach a machine
name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    # tests/coverage.sh measures three shell files (COVERAGE.md): the first
    # boot hook 45nodebb, the image check conf.d/zz-check and the boot
    # test's library. The threshold stays 95 and is only ever raised
    # (decision 0006). fakeroot runs the image check on a scratch tree with
    # owners. This job produces the check "tests / coverage", the required
    # status on main. The job id is part of that name, so renaming it
    # silently detaches the protection rule.
    runs-on: keel-host
    uses: keel-linux/.github/.github/workflows/test-shell.yml@main
    with:
      threshold: 95
      apt-packages: fakeroot python3-yaml
  python:
    # The first boot program nodebb.py and the script serve.py
    # (overlay/usr/lib) under pytest and coverage, lines and branches: 100
    # percent, measured on 2026-11-11.
    runs-on: keel-host
    uses: keel-linux/.github/.github/workflows/test-python.yml@main
    with:
      threshold: 100
      package: overlay/usr/lib
      tests: tests/python
  appliance:
    # The boot test (org-plan section 1): the nodebb layer is fetched from
    # https://mirror.keellinux.org/layers, verified, assembled into a scratch
    # rootfs, booted in LXC and checked by tests/boot-test.sh. Nothing is
    # built there; the build host publishes the layer. So what boots is the
    # layer the mirror publishes, never this branch.
    #
    # On 2026-11-12 https://mirror.keellinux.org/layers/nodebb.manifest
    # answers 404: no nodebb layer is published (the images of 2026-11-05
    # were withdrawn, and the layer on lnpp is not built yet). The job then
    # fails and claims no boot. It passes for real only when a nodebb layer
    # on lnpp is published, after the commissioning of note 0082, step 7.
    # allow_unpublished is not set: it would turn the missing layer into a
    # skip. tests/boot-test.sh checks the layer on lnpp: port 80 serves the
    # forum (0079), and the spec gives db_password.
    if: vars.KEEL_LXC_RUNNER == 'true'
    runs-on: keel-lxc
    uses: keel-linux/.github/.github/workflows/test-appliance.yml@main
    with:
      appliance: nodebb
      parent: lnpp
      timeout: 60
  commission:
    # The commissioning contract, tests/commission.yaml (handbook decision
    # 0075). This job only checks that the contract is there and valid;
    # bin/keel-commission of keel-linux/.github runs it on BR1 and BR2.
    runs-on: keel-host
    uses: keel-linux/.github/.github/workflows/commission-contract.yml@main
  package:
    # "package / changelog" is a required status on main in this repository's
    # protection, and until now no job produced it: a check that is required
    # and never reported leaves every pull request blocked for good. The job
    # is the one keel-mariadb, keel-postgresql and keel-wordpress carry.
    #
    # Only on a pull request. require-changelog compares the two commits of
    # the pull request, which it reads from
    # github.event.pull_request.base.sha; outside a pull request that is
    # empty and the script is handed one argument instead of two, so every
    # push to main failed the check. A job whose condition is false is
    # reported as skipped, which satisfies a required status, so protection
    # keeps working and the check is still a real run on the pull request
    # itself, which is the only place it can say anything.
    if: github.event_name == 'pull_request'
    # This recipe has no debian/changelog: what bt-layer records in the
    # manifest is the top entry of ./changelog, which is also what
    # make-release-deb.py turns into the release package. So that is the
    # file a change which ships has to bump. This job produces the check
    # "package / changelog".
    runs-on: keel-host
    uses: keel-linux/.github/.github/workflows/require-changelog.yml@main
    with:
      changelog: changelog
      # keel/ is the example instance description, which the layer does not
      # ship; the rest is the reusable workflow's own default.
      exempt: '^(tests/|docs/|\.github/|\.forgejo/|keel/|README|COVERAGE\.md|LICENSE|\.gitignore)'
