# keel-nodebb: the routes of NodeBB (handbook note 0082, section 5),
# included by keel-web's default site and by its server behind Anubis.
#
# keel-web's sites end with `location / { try_files ... =404; }`, so a
# second `location /` is a duplicate. A regular expression is not: Nginx
# tries the regular expressions in the order of the file, after the
# longest prefix, so `location ~ ^/` takes every request that no exact
# match (/keel-health) and no prefix with ^~ (/socket.io/) took.
#
# NodeBB listens on 127.0.0.1:4567 only, and it runs on the node whose
# PostgreSQL is writable (usr/lib/keel-nodebb/serve.py). On a standby
# serve.py writes /run/keel-nodebb/replica, and each page is the notice of
# the replica, status 200. With no mark (a primary whose NodeBB stopped)
# the 502 stays. `rewrite ... last` is safe in an `if` of a location.

# The upload routes only take a larger body (keel-web#15, as note 0062).
location ~ ^/api/(?:post/upload|admin/(?:upload|category/uploadpicture)|user/[^/]+/uploadpicture) {
	if (-f /run/keel-nodebb/replica) {
		rewrite ^ /keel-nodebb-replica.html last;
	}
	client_max_body_size 32m;
	proxy_pass http://127.0.0.1:4567;
	proxy_http_version 1.1;
	proxy_connect_timeout 5s;
	proxy_read_timeout 120s;
	proxy_redirect off;
	proxy_set_header Host $host;
	proxy_set_header X-Forwarded-Host $host;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Forwarded-Proto $keel_nodebb_proto;
}

location ~ ^/ {
	if (-f /run/keel-nodebb/replica) {
		rewrite ^ /keel-nodebb-replica.html last;
	}
	proxy_pass http://127.0.0.1:4567;
	proxy_http_version 1.1;
	proxy_connect_timeout 5s;
	proxy_read_timeout 120s;
	proxy_redirect off;
	proxy_set_header Host $host;
	proxy_set_header X-Forwarded-Host $host;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Forwarded-Proto $keel_nodebb_proto;
}

location = /keel-nodebb-replica.html {
	internal;
	root /usr/share/keel-nodebb/www;
	default_type text/html;
	add_header Cache-Control no-store always;
}

# socket.io: one NodeBB process holds every socket, so no ip_hash and no
# sticky session (note 0082, section 4). After a promote the client
# connects again to the VIP.
location ^~ /socket.io/ {
	if (-f /run/keel-nodebb/replica) {
		return 503;
	}
	proxy_pass http://127.0.0.1:4567;
	proxy_http_version 1.1;
	proxy_connect_timeout 5s;
	proxy_read_timeout 3600s;
	proxy_send_timeout 3600s;
	proxy_redirect off;
	proxy_set_header Upgrade $http_upgrade;
	proxy_set_header Connection $keel_nodebb_connection;
	proxy_set_header Host $host;
	proxy_set_header X-Forwarded-Host $host;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Forwarded-Proto $keel_nodebb_proto;
}
