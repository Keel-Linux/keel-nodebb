# keel-nodebb: the body limit of the front site (Keel-Linux/keel-web#15).
# Behind Anubis (the cloud modes) the front site of Keel Web receives a
# request first, and its own limit is 1 MB. An upload of an image is
# larger. This file sets the limit of the upload routes of
# 60-keel-nodebb.conf in keel-default.d: 32 MB. The front cannot tell the
# routes apart before Anubis, so the limit is for the server. The routes in
# keel-default.d keep 1 MB for every other path.
client_max_body_size 32m;
