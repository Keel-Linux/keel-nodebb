# keel-nodebb: two maps for the routes in /etc/nginx/keel-default.d/60-keel-nodebb.conf.

# socket.io needs the Upgrade header, and any other request closes.
map $http_upgrade $keel_nodebb_connection {
	default upgrade;
	'' close;
}

# The protocol that NodeBB sees, as keel-odoo's map: in the cloud modes
# Anubis hands the request back on the unix socket of Nginx, where the
# scheme is http, and the front of keel-web sets X-Forwarded-Proto.
map $http_x_forwarded_proto $keel_nodebb_front_proto {
	default https;
	http http;
}

map $server_addr $keel_nodebb_proto {
	default $scheme;
	~^unix: $keel_nodebb_front_proto;
}
