<h1>This node is the replica of a cloud pair.</h1>
<p>NodeBB runs on the primary node only, because NodeBB writes to its
database and the database of this node is a read-only copy. Open the forum
at the address of the pair (the VIP). If this node becomes the primary,
NodeBB starts here.</p>
